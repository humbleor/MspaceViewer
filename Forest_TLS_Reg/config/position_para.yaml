%YAML:1.0
---
# ============================================================
# 位置配准 配置文件
# 仅包含三角形描述符 + 哈希匹配 + 几何验证相关参数
# ============================================================

# ── 三角形描述符构建 ──
descriptor_near_num: 10        # 每棵树的 K 个最近邻
descriptor_min_len: 2.0        # 三角形最短边阈值 (m)
descriptor_max_len: 50.0       # 三角形最长边阈值 (m)
descriptor_len_diff: 0.1       # 两边最小差值，过滤等腰/等边 (m)
side_resolution: 0.1           # 边长量化精度（哈希键分辨率）

# ── 候选帧选择 ──
rough_dis_threshold: 0.1       # 边长距离阈值（× 边长范数）
vertex_diff_threshold: 0.      # 顶点属性差异（2D 下保持 0）
candidate_num: 50              # 最大候选帧数量

# ── 候选帧验证（SVD + 投票） ──
dist_candi_frames_verify: 2.0  # 三角形顶点变换后距离阈值 (m)
use_matched_num: 4000          # 参与验证的匹配三角形数上限

# ── 几何验证 ──
normal_geo_verify: 1.0         # 法向量差异（2D Z=0 下退化为始终通过）
dis_geo_verify: 0.3            # 点到点距离阈值 (m)

# ── 匹配判定 ──
icp_threshold: 0.5             # 最低匹配成功率（50%）
